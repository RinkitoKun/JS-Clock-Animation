<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #eef0f5;
        }

        .clock {
            position: relative;
            width: 350px;
            height: 350px;
        }

        .clock_face {
            width: 300px;
            height: 300px;
            border-radius: 100%;
            background: #eef0f5;
            top: 50%;
            left: 50%;
            border: 1px solid white;
            transform: translate(-50%, -50%);
            box-shadow: inset -12px -12px 30px 0px rgba(255, 255, 255, 0.2),
                inset 7px 7px 8px 0 rgba(255, 255, 255, 0.52),
                inset 10px 11px 30px -1px rgba(166, 180, 200, 0.71);
            border: 14px solid #eef0f5;
            position: absolute;
            padding: 1rem;
        }

        .hand {
            width: 45%;
            height: 2px;
            background-color: black;
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0 50%;
            transform: rotate(-90deg);
            transition: all 0.5s;
            transition-timing-function: cubic-bezier(0.1, 2.7, 0.58, 1);
        }

        .overlay {
            width: 315px;
            height: 315px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
            border: 1px solid white;
            background-color: transparent;
            box-shadow: 19px 25px 92px -32px rgba(166, 180, 200, 0.45),
                -20px -20px 61px 0 rgba(255, 255, 255, 0.53),
                13px 14px 12px -6px rgba(166, 180, 200, 0.57);
        }

        .hour_hand {
            background-color: #646e82;
            width: 30%;
        }

        .min_hand {
            background-color: #646e82;
        }

        .sec_hand {
            background-color: #fd251e;
            transform: rotate(-90deg) translate(-40px);
            width: 60%;
        }

        .min {
            width: 10px;
            height: 1.4px;
            background-color: #646e82;
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0 50%;
            transform: translateY(-114px) rotate(-90deg);
        }

        .right {
            transform: translateX(114px) rotate(0deg);
        }

        .bottom {
            transform: translateY(124px) rotate(-90deg);

        }

        .left {
            transform: translateX(-124px) rotate(0deg);

        }
    </style>
</head>

<body>
    <div class="clock">
        <div class="clock_face">
            <div class="hand hour_hand"></div>
            <div class="hand min_hand"></div>
            <div class="hand sec_hand"></div>
            <div class="min top"></div>
            <div class="min right"></div>
            <div class="min bottom"></div>
            <div class="min left"></div>
        </div>
        <div class="clock_face overlay"></div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
